# playbook.yml
---
- name: Configure Ubuntu VM
  hosts: virtualbox
  user: oclaw 
  become: true

  vars:
      env_vars: "{{ lookup('ansible.builtin.file', '.env').splitlines() | select('match', '^[^#]') | list }}"

  tasks:

    - name: Set environment variables system-wide
      lineinfile:
        path: /etc/environment
        regexp: "^{{ item.split('=')[0] }}="
        line: "{{ item }}"
      loop: "{{ env_vars }}"

    - name: Update apt cache
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install common packages
      apt:
        name:
          - vim
          - curl
          - git
          - htop
          - neofetch
          - build-essential
          - duf
          - eza
          - python3-pip
          - python3
          - fzf
          - ripgrep
        state: present

    - name: Download NodeSource setup script
      get_url:
        url: https://deb.nodesource.com/setup_lts.x
        dest: /tmp/nodesource_setup.sh
        mode: '0755'

    - name: Run NodeSource setup script
      command: bash /tmp/nodesource_setup.sh

    - name: Install nodejs
      apt:
        name: nodejs
        state: latest
        update_cache: yes

