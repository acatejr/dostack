# playbook.yml
---
- name: Configure Ubuntu VM
  hosts: virtualbox
  user: acatejr
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install common packages
      apt:
        name:
          - vim
          - curl
          - git
          - htop
          - neofetch
        state: present

